<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .container {
      width: 90%;
      max-width: 550px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    h1 {
      color: #111827;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 Video Downloader</h1>

    <p>Enter a direct video file URL</p>

    <input
      type="url"
      id="videoURL"
      placeholder="https://example.com/video.mp4"
    >

    <button onclick="downloadVideo()">
      Download Video
    </button>

    <div id="message"></div>

    <div class="note">
      Supports direct video URLs such as MP4/WebM files.
    </div>

  </div>

  <script>

    function downloadVideo() {

      const url = document.getElementById("videoURL").value.trim();
      const message = document.getElementById("message");

      if (!url) {
        message.style.color = "red";
        message.innerText = "Please enter a video URL.";
        return;
      }

      try {
        new URL(url);
      } catch (error) {
        message.style.color = "red";
        message.innerText = "Please enter a valid URL.";
        return;
      }

      message.style.color = "green";
      message.innerText = "Starting download...";

      const link = document.createElement("a");

      link.href = url;
      link.download = "video";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      setTimeout(() => {
        message.innerText = "Download started!";
      }, 1000);
    }

  </script>

</body>
</html>
